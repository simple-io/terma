[package]
name = "terma"
version = "0.1.0"
edition = "2024"
description = "Cross-platform AI terminal built with Rust + Slint"
license = "MIT"

[dependencies]
slint = {version = "1", features = ["renderer-skia"]}
portable-pty = "0.8"
anyhow = "1"
vte = "0.13"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
# 系统字体枚举（macOS: CoreText / Linux: Fontconfig / Windows: DirectWrite）
font-kit = "0.14"
# 终端响铃音频播放（关闭默认解码器特性，仅保留 cpal 播放后端，减小体积）
rodio = { version = "0.20", default-features = false }

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
