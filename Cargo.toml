[package]
name = "terma"
version = "0.1.0"
edition = "2024"
description = "Cross-platform AI terminal built with Rust + Slint"
license = "MIT"

[dependencies]
slint = "1.17"
portable-pty = "0.8"
anyhow = "1"
vte = "0.13"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
