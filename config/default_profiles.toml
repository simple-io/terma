# terma 默认 Profile 配置参考（Phase 6 将由 ProfileManager 加载）
#
# 当前 Phase 1 的默认 Profile 由 ProfileManager::create_default_profiles()
# 按平台内联生成；此文件为 Phase 6 持久化加载的目标格式参考。
#
# 字段说明：
#   id                Profile 唯一标识（字符串）
#   name              Tab 标题 / 菜单显示名
#   command           启动的 shell / 命令
#   args              命令参数（可选）
#   working-directory 工作目录（可选）
#   icon              图标标识（可选，后续）
#   color-scheme      颜色方案名（可选，后续）

default_profile = "zsh"

[[profiles]]
id = "zsh"
name = "Zsh"
command = "/bin/zsh"

[[profiles]]
id = "bash"
name = "Bash"
command = "/bin/bash"

