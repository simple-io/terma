# terma 默认配置参考
#
# 实际配置文件位置：
#   macOS:  ~/Library/Application Support/terma/config.toml
#   Linux:  ~/.config/terma/config.toml
#   Windows: %APPDATA%\terma\config.toml
#
# 文件不存在时由 ProfileManager 生成平台默认配置并落盘。
# 旧版 profiles.toml 会被自动迁移为 config.toml。
#
# 结构说明：
#   [general]      通用配置（外观、行为、默认启动项）
#   [[profiles]]   启动项列表（每个 Profile 描述如何启动一个终端）

[general]
default_profile = "zsh"
font_family = "Monaco"
font_size = 12
# 初始尺寸（终端打开时的默认行/列数，结合字体度量换算窗口像素尺寸）
initial_rows = 36
initial_cols = 120
cursor_style = "block"
# 光标颜色（全局外观项，独立于配色方案，格式 #RRGGBB）
cursor_color = "#ffffff"
# 光标闪烁（true = 周期闪烁 / false = 常亮）
cursor_blink = true
# 配色方案名（内置：Default / Solarized Dark / Dracula / Gruvbox Dark / Nord /
# One Dark / Tokyo Night / Catppuccin Mocha / Solarized Light / GitHub Light）
# 用户自定义方案保存在 [[general.color_schemes]]，同名优先于内置。
color_scheme = "Default"
bell_sound = false
scrollback_limit = 10000

# 自定义配色方案示例（前景/背景/选区 + 16 色 ANSI 调色板）：
# [[general.color_schemes]]
# name = "My Scheme"
# foreground = "#c3c3c3"
# background = "#000000"
# selection = "#3f3f46"
# palette = [
#   "#000000", "#cd0000", "#00cd00", "#cdcd00", "#0000ee", "#cd00cd", "#00cdcd", "#e5e5e5",
#   "#7f7f7f", "#ff0000", "#00ff00", "#ffff00", "#5c5cff", "#ff00ff", "#00ffff", "#ffffff",
# ]

[[profiles]]
id = "zsh"
name = "Zsh"
command = "/bin/zsh"

[[profiles]]
id = "bash"
name = "Bash"
command = "/bin/bash"

# Profile 字段说明：
#   id                Profile 唯一标识（字符串）
#   name              Tab 标题 / 菜单显示名
#   command           启动的 shell / 命令
#   args              命令参数（可选，数组）
#   working_directory 工作目录（可选）
#   env_vars          环境变量（可选，键值对）
#   icon              图标标识（可选，后续）
#   color_scheme      颜色方案名（可选，后续）

# 带完整字段的 Profile 示例：
# [[profiles]]
# id = "dev"
# name = "Dev Shell"
# command = "/bin/zsh"
# args = ["--login"]
# working_directory = "/home/user/projects"
# env_vars = { TERM = "xterm-256color", MY_PROJECT = "terma" }

# Windows 示例：
# [[profiles]]
# id = "powershell"
# name = "PowerShell"
# command = "powershell.exe"
#
# [[profiles]]
# id = "wsl-ubuntu"
# name = "WSL Ubuntu"
# command = "wsl.exe"
# args = ["-d", "Ubuntu"]
